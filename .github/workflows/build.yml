name: Build GetWiFi

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_NAME: com.debstudy.getwifi
  PACKAGE_VERSION: "1.0.0"

jobs:
  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build getwifi (public API)
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework CoreLocation \
            -framework SystemConfiguration \
            -o build/getwifi \
            src/getwifi_public.m

      - name: Verify binary
        run: |
          file build/getwifi
          lipo -info build/getwifi

      - name: Build DEB
        run: |
          cd $GITHUB_WORKSPACE
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg || true
          
          rm -rf staging
          mkdir -p staging/DEBIAN staging/usr/local/bin
          
          cp build/getwifi staging/usr/local/bin/
          chmod 755 staging/usr/local/bin/getwifi
          
          printf 'Package: %s\nVersion: %s\nSection: Utilities\nPriority: optional\nArchitecture: iphoneos-arm64\nMaintainer: DebStudy <debstudy@example.com>\nDescription: iOS WiFi info tool\n  Get WiFi SSID using public APIs\nDepends: firmware (>=13.0)\n' "${PACKAGE_NAME}" "${PACKAGE_VERSION}" > staging/DEBIAN/control
          
          printf '#!/bin/sh\nchmod 755 /usr/local/bin/getwifi\n' > staging/DEBIAN/postinst
          chmod 755 staging/DEBIAN/postinst
          
          DEB_FILE="${PACKAGE_NAME}_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          
          if command -v dpkg-deb &> /dev/null; then
            dpkg-deb -b staging "$DEB_FILE"
          else
            echo "dpkg-deb not found, using Python to build deb..."
            python3 -c "
          import os, tarfile, io, struct, time
          staging = 'staging'
          deb_file = '${DEB_FILE}'
          # Build control.tar.gz
          ctrl_buf = io.BytesIO()
          with tarfile.open(fileobj=ctrl_buf, mode='w:gz') as tar:
            for f in os.listdir(os.path.join(staging, 'DEBIAN')):
              tar.add(os.path.join(staging, 'DEBIAN', f), arcname=f)
          # Build data.tar.gz
          data_buf = io.BytesIO()
          with tarfile.open(fileobj=data_buf, mode='w:gz') as tar:
            for root, dirs, files in os.walk(staging):
              if 'DEBIAN' in root: continue
              for f in files:
                fp = os.path.join(root, f)
                arc = os.path.relpath(fp, staging)
                tar.add(fp, arcname='./' + arc)
          # Write deb (ar format)
          with open(deb_file, 'wb') as out:
            out.write(b'!<arch>\n')
            def write_entry(name, data):
              header = name.ljust(16).encode() + b'0           0     100644  '
              header += str(len(data)).rjust(10).encode() + b'  0     U\n'
              out.write(header + data)
              if len(data) % 2: out.write(b'\n')
            write_entry('debian-binary/     ', b'2.0\n')
            write_entry('control.tar.gz/    ', ctrl_buf.getvalue())
            write_entry('data.tar.gz/       ', data_buf.getvalue())
          print(f'Built {deb_file}: {os.path.getsize(deb_file)} bytes')
          "
          fi
          
          ls -lh "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
            *.deb
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cl /Fe:build\getwifi.exe src\getwifi_cross.c /link ws2_32.lib

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/getwifi.exe
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          mkdir -p build
          gcc -o build/getwifi src/getwifi_cross.c
          file build/getwifi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/getwifi
          retention-days: 30
