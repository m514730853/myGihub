name: Build GetWiFi

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_NAME: com.debstudy.getwifi
  PACKAGE_VERSION: "1.0.0"

jobs:
  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build getwifi (public API)
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework CoreLocation \
            -framework SystemConfiguration \
            -o build/getwifi \
            src/getwifi_public.m

      - name: Verify binary
        run: |
          file build/getwifi
          lipo -info build/getwifi

      - name: Build DEB
        run: |
          cd $GITHUB_WORKSPACE
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg || true
          rm -rf staging
          mkdir -p staging/var/jb/usr/local/bin
          cp DEBIAN staging/ -r
          cp build/getwifi staging/var/jb/usr/local/bin/
          chmod 755 staging/var/jb/usr/local/bin/getwifi
          chmod 755 staging/DEBIAN/postinst
          
          DEB_FILE="${PACKAGE_NAME}_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          
          if command -v dpkg-deb &> /dev/null; then
            dpkg-deb -b staging "$DEB_FILE"
          else
            echo "dpkg-deb not found, using Python to build deb..."
            python3 build_deb.py staging "$DEB_FILE"
          fi
          
          ls -lh "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
            *.deb
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cl /Fe:build\getwifi.exe src\getwifi_cross.c /link ws2_32.lib

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/getwifi.exe
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          mkdir -p build
          gcc -o build/getwifi src/getwifi_cross.c
          file build/getwifi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/getwifi
          retention-days: 30
