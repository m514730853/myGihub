name: Build GetWiFi

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_NAME: com.debstudy.getwifi
  PACKAGE_VERSION: "1.0.0"

jobs:
  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build getwifi (hybrid)
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework SystemConfiguration \
            -o build/getwifi \
            src/getwifi_hybrid.m \
            -ldl

      - name: Verify binary
        run: |
          file build/getwifi
          lipo -info build/getwifi

      - name: Build DEB
        run: |
          cd $GITHUB_WORKSPACE
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg || true
          rm -rf staging
          mkdir -p staging/DEBIAN staging/var/jb/usr/local/bin
          cp DEBIAN/control staging/DEBIAN/
          cp DEBIAN/postinst staging/DEBIAN/
          cp build/getwifi staging/var/jb/usr/local/bin/
          chmod 755 staging/var/jb/usr/local/bin/getwifi
          chmod 755 staging/DEBIAN/postinst
          
          DEB_FILE="${PACKAGE_NAME}_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          
          if command -v dpkg-deb &> /dev/null; then
            dpkg-deb -b staging "$DEB_FILE"
          else
            echo "dpkg-deb not found, using Python to build deb..."
            python3 build_deb.py staging "$DEB_FILE"
          fi
          
          ls -lh "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
            *.deb
          retention-days: 30
