name: Build GetWiFi iOS Plugin

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_NAME: com.debstudy.getwifi
  PACKAGE_VERSION: "1.0.0"

jobs:
  build-ios:
    name: Build iOS Plugin (macOS)
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          echo "OS: $(sw_vers)"
          echo "Xcode: $(xcodebuild -version)"
          xcrun --sdk iphoneos --show-sdk-path >> sdk_path.txt
          echo "SDK: $(cat sdk_path.txt)"
          brew install dpkg

      - name: Build getwifi
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build
          SDK=$(cat sdk_path.txt)
          
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -o build/getwifi \
            src/getwifi.m \
            -lMobileWiFi

      - name: Build GetWiFi.dylib
        run: |
          cd $GITHUB_WORKSPACE
          SDK=$(cat sdk_path.txt)
          
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -fPIC -shared \
            -framework UIKit \
            -framework Foundation \
            -o build/GetWiFi.dylib \
            src/GetWiFi.mm \
            -lMobileWiFi

      - name: Verify binaries
        run: |
          echo "=== Binary Info ==="
          file build/getwifi
          file build/GetWiFi.dylib
          echo "=== Architecture ==="
          lipo -info build/getwifi
          lipo -info build/GetWiFi.dylib

      - name: Build DEB package
        run: |
          cd $GITHUB_WORKSPACE
          VERSION="${{ env.PACKAGE_VERSION }}"
          
          rm -rf staging
          mkdir -p staging/DEBIAN staging/usr/local/bin staging/Library/Loader/SBPlugins
          
          cp build/getwifi staging/usr/local/bin/
          cp build/GetWiFi.dylib staging/Library/Loader/SBPlugins/
          chmod 755 staging/usr/local/bin/getwifi staging/Library/Loader/SBPlugins/GetWiFi.dylib
          
          printf 'Package: %s\nVersion: %s\nSection: Utilities\nPriority: optional\nArchitecture: arm64\nMaintainer: DebStudy <debstudy@example.com>\nDescription: iOS WiFi plugin\n  Get WiFi SSID, BSSID, signal strength\nDepends: firmware (>=11.0), mobilesubstrate\n' "${PACKAGE_NAME}" "$VERSION" > staging/DEBIAN/control
          
          printf '#!/bin/sh\nchmod 755 /usr/local/bin/getwifi\nkillall -9 SpringBoard 2>/dev/null || true\n' > staging/DEBIAN/postinst
          chmod 755 staging/DEBIAN/postinst
          
          printf '#!/bin/sh\nkillall -9 SpringBoard 2>/dev/null || true\n' > staging/DEBIAN/postrm
          chmod 755 staging/DEBIAN/postrm
          
          DEB_FILE="${PACKAGE_NAME}_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -b staging "$DEB_FILE"
          
          echo "DEB created:"
          ls -lh "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
            *.deb
          retention-days: 30

  build-windows:
    name: Build Windows Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with GCC
        shell: bash
        run: |
          if ! command -v gcc &> /dev/null; then
            echo "Installing MinGW..."
            curl -L -o mingw.zip "https://github.com/niXman/mingw-builds-binaries/releases/download/13.1.0-rt11.0.0-ucrt-v12.0.0-x86_64-posix-seh/mingw13.1.0-rt11.0.0-ucrt-v12.0.0-x86_64-posix-seh.zip"
            unzip -q mingw.zip -d mingw64
            export PATH="$PWD/mingw64/bin:$PATH"
          fi
          
          gcc --version
          mkdir -p build
          gcc -o build/getwifi.exe src/getwifi_cross.c -lws2_32
          file build/getwifi.exe
      
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/getwifi.exe
          retention-days: 30

  build-linux:
    name: Build Linux Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          gcc --version
          mkdir -p build
          gcc -o build/getwifi src/getwifi_cross.c
          file build/getwifi
      
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/getwifi
          retention-days: 30
