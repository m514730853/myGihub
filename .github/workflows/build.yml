name: Build GetWiFi

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_NAME: com.debstudy.getwifi
  PACKAGE_VERSION: "1.0.0"

jobs:
  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          cd $GITHUB_WORKSPACE
          if command -v ldid &> /dev/null; then
            echo "ldid already installed"
          else
            echo "Installing ldid from source..."
            git clone --depth 1 https://github.com/theos/ldid.git /tmp/ldid-src || true
            cd /tmp/ldid-src && make && sudo make install || true
            cd $GITHUB_WORKSPACE
          fi
          ldid --version 2>/dev/null || echo "ldid may not be available"

      - name: Build getwifi binary
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework SystemConfiguration \
            -o build/getwifi \
            src/getwifi_hybrid.m \
            -ldl

      - name: Sign binary
        run: |
          cd $GITHUB_WORKSPACE
          if command -v ldid &> /dev/null; then
            ldid -Sentitlements.plist build/getwifi && echo "Signed with ldid" || echo "ldid signing failed"
          fi
          file build/getwifi
          lipo -info build/getwifi

      - name: Build DEB
        run: |
          cd $GITHUB_WORKSPACE
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg || true
          rm -rf staging
          mkdir -p staging/DEBIAN staging/var/jb/usr/local/bin
          cp DEBIAN/control staging/DEBIAN/
          cp DEBIAN/postinst staging/DEBIAN/
          cp build/getwifi staging/var/jb/usr/local/bin/getwifi_bin
          cp src/getwifi.sh staging/var/jb/usr/local/bin/getwifi_sh
          python3 setup_wrapper.py staging
          chmod 755 staging/DEBIAN/postinst
          DEB_FILE="${PACKAGE_NAME}_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          if command -v dpkg-deb &> /dev/null; then
            dpkg-deb -b staging "$DEB_FILE"
          else
            python3 build_deb.py staging "$DEB_FILE"
          fi
          ls -lh "$DEB_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
            *.deb
          retention-days: 30
